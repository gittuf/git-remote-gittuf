# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: git-remote-gittuf

builds:
- id: git-remote-gittuf
  mod_timestamp: '{{ .CommitTimestamp }}'
  env:
  - CGO_ENABLED=0
  flags:
  - -trimpath
  goos:
  - linux
  - darwin
  - freebsd
  - windows
  goarch:
  - amd64
  - arm64
  ldflags:
  - "-s -w"
  - "-extldflags=-zrelro"
  - "-extldflags=-znow"
  - "-buildid= -X github.com/gittuf/git-remote-gittuf/internal.gitVersion={{ .Version }}"

archives:
- id: binary
  formats: ['binary']
  allow_different_binary_count: true

gomod:
  proxy: true

changelog:
  disable: true

checksum:
  name_template: "checksums.txt"

signs:
- cmd: cosign
  env:
  - COSIGN_YES=true
  signature: '${artifact}.sigstore.json'
  args:
  - sign-blob
  - '${artifact}'
  - '--bundle=${signature}'
  artifacts: checksum
  output: true

source:
  enabled: true
  name_template: "{{ .ProjectName }}.src"

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

release:
  prerelease: allow
  github:
    owner: gittuf
    name: git-remote-gittuf
  draft: true
